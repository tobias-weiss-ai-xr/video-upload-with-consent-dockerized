services:
  upload:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    environment:
      - MAX_MB=500
      - CLAMD_HOST=clamd
    depends_on:
      - clamd
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=2g
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  clamd:
    image: clamav/clamav:latest
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
